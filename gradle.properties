# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# -Djdk.net.unixdomain.tmpdir=INVALID works around a JDK NIO bug on this
# machine where Selector.open() fails ("Unable to establish loopback
# connection") because the default AF_UNIX-based self-pipe can't be created
# in %TEMP%. Forcing an invalid unix-domain tmpdir makes the JDK fall back
# to a plain TCP loopback pipe. Safe to drop if a future JDK/OS combination
# no longer needs it.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=INVALID
# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration has changed.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself.
android.nonTransitiveRClass=true
android.useAndroidX=true
